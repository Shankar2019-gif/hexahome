name: HexaHome CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 1. FRONTEND CI: Lint, Type Check & Production Vite Build
  # ===========================================================================
  frontend-ci:
    name: Frontend CI (React 19 & Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Code Linter (oxlint)
        run: npm run lint

      - name: Build Production Bundle (Vite)
        run: npm run build

      - name: Verify Build Output
        run: |
          test -f dist/index.html || { echo "dist/index.html missing!"; exit 1; }
          echo "Frontend build verified successfully."

      - name: Archive Frontend Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ===========================================================================
  # 2. GATEWAY CI: Java 17 & Reactive Spring Cloud Gateway Compilation
  # ===========================================================================
  gateway-ci:
    name: Gateway CI (Spring Cloud Gateway)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Verify Gateway
        run: mvn -B clean test-compile

  # ===========================================================================
  # 3. BACKEND CI: Java 17, Spring Boot 3.3.4 & Full Unit Test Suite (130 Tests)
  # ===========================================================================
  backend-ci:
    name: Backend CI (Spring Boot & 130 Unit Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Unit & Integration Tests
        run: mvn -B clean test

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: backend/target/surefire-reports
          retention-days: 7

  # ===========================================================================
  # 4. CONTAINER BUILD VERIFICATION: Multi-service Docker Build Validation
  # ===========================================================================
  docker-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [frontend-ci, gateway-ci, backend-ci]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: hexahome-backend:ci

      - name: Build Gateway Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: false
          tags: hexahome-gateway:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: hexahome-frontend:ci
