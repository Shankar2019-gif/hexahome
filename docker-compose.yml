services:
  # 1. PostgreSQL 16 with PostGIS 3.4
  postgres:
    image: postgis/postgis:16-3.4
    container_name: hexahome-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hexahome_db}
      POSTGRES_USER: ${POSTGRES_USER:-hexahome_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hexahome_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hexahome_user} -d ${POSTGRES_DB:-hexahome_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hexahome-network

  # 2. Redis 7.2 (Rate Limiting, Session/Cache)
  redis:
    image: redis:7.2-alpine
    container_name: hexahome-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-hexahome_redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hexahome_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hexahome-network

  # 3. Backend (Spring Boot 3.3.4 REST API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hexahome-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hexahome_db}
      POSTGRES_USER: ${POSTGRES_USER:-hexahome_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hexahome_password}
      PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:8085}
      HEXAHOME_ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_USERNAME:-admin}
      HEXAHOME_ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_PASSWORD:-Admin@HexaHome2025}
      HEXAHOME_ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_EMAIL:-admin@hexahome.in}
      STORAGE_BASE_URL: http://localhost:8081/uploads
      LOCAL_STORAGE_DIR: /app/uploads
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_Tnhdqxkz85pAVO}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-I7gB5W1CHl358SPjZyA3SMVp}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-hexahome_rzp_webhook_secret_2025}
    ports:
      - "8081:8081"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - hexahome-network

  # 4. API Gateway (Spring Cloud Gateway 2023.0.3 Reactive Edge)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: hexahome-gateway
    restart: always
    environment:
      PORT: 8080
      BACKEND_URI: http://backend:8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-hexahome_redis_secret}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - hexahome-network

  # 5. Frontend (React 19 + Vite Nginx Container)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hexahome-frontend
    restart: always
    ports:
      - "8085:80"
      - "80:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - hexahome-network

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  hexahome-network:
    driver: bridge
